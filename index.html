<!DOCTYPE html>

<head>

<body>

<!-- Icon + logo sprite -->

      <path d="M24 24V13M24 24l7 4" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="24" cy="24" r="3" fill="url(#lg)"/>

    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>

    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>

    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.6 1.7 7L12 17.8 5.6 21.2l1.7-7L2 9.6 9 9z"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>

    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>

    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.7-4 3-9 3s-9-1.3-9-3M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></symbol>
    <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h3l8 5V5L7 10H4a1 1 0 0 0-1 1zM19 8a5 5 0 0 1 0 8"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></symbol>
    <symbol id="i-cmd" viewBox="0 0 24 24"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 0 0 0-6z"/></symbol>

<div id="bg-layer" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="float-layer" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="announce" class="announce hidden" role="status"></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div>
      <button id="brand-btn" class="brand" data-act="logo" title="Ghadi Ka Pahiya">
        <svg class="logo-svg" viewBox="0 0 48 48"><use href="#logo"/></svg>
        <span class="brand-text">Ghadi Ka Pahiya</span>
      </button>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="side-bottom">
      <div id="level-card" class="level-card"></div>
      <button class="btn btn-primary btn-block" data-act="new-task"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">New Task</span></button>
      <div class="side-row">
        <button class="icon-btn" data-act="palette" title="Command palette (Ctrl+K)"><svg class="ic"><use href="#i-cmd"/></svg></button>
        <button class="icon-btn" data-act="toggle-theme" title="Toggle light/dark" id="theme-toggle"></button>
        <span id="sync" class="sync" title="Sync status"></span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar hidden" id="topbar">
      <div id="filters" class="filters"></div>
      <div id="date-controls" class="date-controls">
        <button class="icon-btn" data-act="prev" title="Previous day"><svg class="ic"><use href="#i-left"/></svg></button>
        <label class="date-label"><span id="date-label">Today</span><input type="date" id="date-input" data-change="date-input"></label>
        <button class="icon-btn" data-act="next" title="Next day"><svg class="ic"><use href="#i-right"/></svg></button>
        <button class="btn btn-ghost btn-sm" data-act="today">Today</button>
      </div>
    </header>
    <div class="views" id="views">
      <section id="view-calendar" class="view"></section>
      <section id="view-monthly" class="view hidden"></section>
      <section id="view-focus" class="view hidden"></section>
      <section id="view-syllabus" class="view hidden"></section>
      <section id="view-analytics" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
      <section id="view-admin" class="view hidden"></section>
    </div>
  </main>
</div>

<nav class="mobile-nav" id="mobile-nav"></nav>
<button class="fab" data-act="new-task" title="New task" aria-label="New task"><svg class="ic"><use href="#i-plus"/></svg></button>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="script.js"></script>
<script src="analytics.js"></script>
<script src="admin.js"></script>
</body>
</html>
